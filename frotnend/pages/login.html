<!DOCTYPE html>
<html>
<head>
    <title>Bookpie - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="../config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React

        function Login() {
            const [username, setUsername] = useState("")
            const [password, setPassword] = useState("")
            const [error, setError] = useState(null)
            const [token, setToken] = useState(null)

            async function handleLogin() {
                try {
                    const res = await axios.post(`${API_BASE_URL}/users/login`, {
                        username,
                        password
                    })
                    setToken(res.data.access_token)
                    setError(null)
                    localStorage.setItem("token", res.data.access_token)
                    window.location.href = "./dashboard.html"
                } catch (err) {
                    setError("Invalid credentials")
                }
            }

            return (
                <div style={{ display: 'flex', width: '260px', alignItems: 'center', justifyContent: 'center', minHeight: '25vh', gap: '1rem', flexWrap: 'wrap', background: 'var(--gold)'}}>
                    <div>
                        <div className="cover-brand">
                            <h1>Book<em>worm</em></h1>
                        </div>
                        <input placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} style={{ width: '260px', display: 'block' }} />
                        <input placeholder="Password" type="password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '260px', display: 'block' }} />
                        <button onClick={handleLogin}>Login</button>
                        {error && <p style={{color: "#D53E4F"}}><b>{error}</b></p>}
                    </div>
                    <div style={{ textAlign: 'center', maxWidth: '350px', textAlign: 'center', width: '260px' }}>
                        <img src="../images/logo.png" alt="Logo for Bookpie" style={{ width: '260px' }}/>
                        <div style={{ marginTop: '0.25rem' }}>
                            <p style={{ fontSize: '0.8rem', marginTop: '0.5rem', color: '#000000' }}>
                                Keep notes on your books, Track your reading, discover new content. All in one place.
                            </p>
                        </div>
                    </div>
                </div>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Login />)
    </script>
</body>
</html>
