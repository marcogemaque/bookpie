[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookworm"
version = "0.0.b2"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "sqlalchemy==2.0.51",
  "pydantic==2.13.4",
  "passlib==1.7.4",
  "PyJWT==2.13.0",
  "python-dotenv==1.2.2",
  "uvicorn==0.34.0",
  "jinja2==3.1.6"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]